[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semantic-cover-search"
version = "0.1.0"
description = "Semantic cover-song discovery from audio transcription and vector similarity."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faiss-cpu>=1.8",
  "faster-whisper>=1.1",
  "sherpa-onnx>=1.12.0",
  "huggingface-hub>=0.21",
  "av>=11,<18",
  "sentence-transformers>=3.0",
  "gradio>=5.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "mutagen>=1.47",
  "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
openai = ["openai>=1.68"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/cover_search"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Avoid inaccessible global Windows TEMP folders when using tmp_path fixtures.
addopts = "--basetemp=.pytest_tmp"
