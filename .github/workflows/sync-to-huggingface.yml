name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: false

jobs:
  sync:
    name: Publish Space
    runs-on: ubuntu-latest
    steps:
      - name: Check Hugging Face token configuration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Repository secret HF_TOKEN is missing."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Hugging Face Hub client
        run: python -m pip install "huggingface_hub>=0.30,<2"

      - name: Build Space upload with deployment metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path(".")
          destination = Path("/tmp/semantic-cover-space")
          destination.mkdir(parents=True, exist_ok=True)
          for name in ("app.py", "pyproject.toml", "requirements.txt", "README.md"):
              shutil.copy2(source / name, destination / name)
          for name in ("src", "docs"):
              shutil.copytree(source / name, destination / name, dirs_exist_ok=True)

          metadata = """---
          title: Semantic Cover Search
          emoji: 🎵
          colorFrom: blue
          colorTo: purple
          sdk: gradio
          python_version: "3.12"
          app_file: app.py
          pinned: false
          ---

          """
          readme = destination / "README.md"
          readme.write_text(metadata + readme.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Publish repository snapshot to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id="esthermariamh/semantic-cover-search",
              repo_type="space",
              folder_path="/tmp/semantic-cover-space",
              delete_patterns="*",
              commit_message="Deploy from GitHub main",
          )
          PY
